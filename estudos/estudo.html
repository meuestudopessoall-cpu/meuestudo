<script>
// ============================================================
// DADOS COMPLETOS DAS AULAS (expandido)
// ============================================================
const AULAS = {
    "direito-constitucional": {
        "modulo-1": {
            "aula-1": {
                titulo: "Conceito, Sentidos e Classificações da Constituição",
                conteudo: `
                    <h2>📌 Conceito</h2>
                    <p>A Constituição é a <strong>lei fundamental e suprema</strong> de um Estado. Ela organiza os Poderes, define a forma de governo e estabelece os direitos fundamentais.</p>
                    <h2>🔍 Explicação Aprofundada</h2>
                    <p><strong>Sentido Sociológico (Lassalle):</strong> A Constituição real resume-se aos <strong>fatores reais de poder</strong> — forças econômicas, sociais e políticas. O texto escrito que não reflete esses fatores é mera "folha de papel".</p>
                    <p><strong>Sentido Político (Schmitt):</strong> A Constituição é a <strong>decisão política fundamental</strong> tomada pelo titular do poder constituinte.</p>
                    <p><strong>Sentido Jurídico (Kelsen):</strong> A Constituição é a <strong>norma pura</strong>, o ápice do ordenamento jurídico, fundamento de validade.</p>
                    <h3>📂 Classificações da CF/88</h3>
                    <ul>
                        <li><strong>Origem:</strong> Promulgada.</li>
                        <li><strong>Estabilidade:</strong> Totalmente Rígida.</li>
                        <li><strong>Forma:</strong> Escrita.</li>
                        <li><strong>Conteúdo:</strong> Formal e Material.</li>
                        <li><strong>Modo de elaboração:</strong> Dogmática.</li>
                        <li><strong>Extensão:</strong> Analítica.</li>
                    </ul>
                    <div class="secao macete">
                        <strong>🧠 Macete:</strong> "PEDRO É FERA" — <strong>P</strong>romulgada, <strong>E</strong>scrita, <strong>D</strong>ogmática, <strong>R</strong>ígida, <strong>A</strong>nalítica, <strong>F</strong>ormal.
                    </div>
                    <div class="secao pegadinha">
                        <strong>⚠️ Pegadinha da Banca:</strong> A Cebraspe adora afirmar que a CF/88 é semi-rígida. <strong>ERRADO!</strong> É <strong>totalmente rígida</strong>.
                    </div>
                    <div class="secao atencao">
                        <strong>📌 Atenção:</strong> CF/88 ≠ imutável. Pode ser alterada por Emenda Constitucional, mas por um processo mais difícil.
                    </div>
                    <h2>🎯 O que realmente cai em prova</h2>
                    <ul>
                        <li>Sentido sociológico (Lassalle) = fatores reais de poder / "folha de papel".</li>
                        <li>Sentido político (Schmitt) = decisão política fundamental.</li>
                        <li>Sentido jurídico (Kelsen) = norma pura.</li>
                        <li>CF/88 = promulgada, rígida, escrita, dogmática, analítica.</li>
                        <li>A CF/88 NÃO é semi-rígida.</li>
                    </ul>
                    <a href="questoes.html?materia=direito-constitucional&modulo=modulo-1&aula=aula-1" target="_blank" class="btn-praticar">📝 Praticar questões desta aula</a>
                `
            }
        },
        "modulo-2": {
            "aula-1": {
                titulo: "Poder Constituinte Originário e Derivado",
                conteudo: `
                    <h2>📌 Conceito</h2>
                    <p><strong>Poder Constituinte</strong> é a capacidade de criar, modificar ou complementar a Constituição.</p>
                    <h2>🔍 Explicação Aprofundada</h2>
                    <p><strong>Poder Constituinte Originário (PCO):</strong> Cria a Constituição. É <strong>inicial, incondicionado, ilimitado e autônomo</strong>. Titular: povo. Exercício: Assembleia Constituinte ou outorga.</p>
                    <p><strong>Poder Constituinte Derivado (PCD):</strong> Modifica ou complementa a Constituição. Subdivide-se em:</p>
                    <ul>
                        <li><strong>Reformador:</strong> Emendas Constitucionais (3/5 em dois turnos).</li>
                        <li><strong>Decorrente:</strong> Estados-membros elaboram suas Constituições (simetria).</li>
                        <li><strong>Difuso:</strong> Municípios elaboram leis orgânicas.</li>
                    </ul>
                    <div class="secao macete">
                        <strong>🧠 Macete:</strong> Características do PCO: <strong>"INILA"</strong> — <strong>I</strong>nicial, <strong>N</strong>ão condicionado, <strong>I</strong>limitado, <strong>L</strong>ivre, <strong>A</strong>utônomo.
                    </div>
                    <div class="secao pegadinha">
                        <strong>⚠️ Pegadinha da Banca:</strong> Afirmar que o povo pode propor PEC. <strong>ERRADO!</strong> A iniciativa é de: 1/3 da Câmara, 1/3 do Senado, Presidente ou maioria das Assembleias.
                    </div>
                    <div class="secao atencao">
                        <strong>📌 Atenção:</strong> O Distrito Federal <strong>não exerce</strong> poder decorrente. Tem <strong>Lei Orgânica</strong> (art. 32 da CF).
                    </div>
                    <a href="questoes.html?materia=direito-constitucional&modulo=modulo-2&aula=aula-1" target="_blank" class="btn-praticar">📝 Praticar questões desta aula</a>
                `
            }
        },
        "modulo-3": {
            "aula-1": {
                titulo: "Princípios Fundamentais (Arts. 1º a 4º)",
                conteudo: `
                    <h2>📌 Conceito</h2>
                    <p>Os Princípios Fundamentais estão nos arts. 1º a 4º da CF. Eles definem a <strong>identidade do Estado brasileiro</strong>.</p>
                    <h2>🔍 Explicação Aprofundada</h2>
                    <p><strong>Fundamentos (Art. 1º):</strong> Soberania, Cidadania, Dignidade da pessoa humana, Valores sociais do trabalho e da livre iniciativa, Pluralismo político.</p>
                    <p><strong>Objetivos (Art. 3º):</strong> Construir sociedade livre/justa/solidária, Garantir desenvolvimento, Erradicar pobreza, Reduzir desigualdades, Promover bem de todos.</p>
                    <p><strong>Relações Internacionais (Art. 4º):</strong> Independência, Direitos humanos, Autodeterminação, Não intervenção, Igualdade, Paz, Repúdio ao terrorismo, Cooperação.</p>
                    <div class="secao macete">
                        <strong>🧠 Macete (Fundamentos):</strong> "SO CI DIPLU" — <strong>SO</strong>berania, <strong>CI</strong>dadania, <strong>DI</strong>gnidade, <strong>PLU</strong>ralismo.
                    </div>
                    <div class="secao pegadinha">
                        <strong>⚠️ Pegadinha da Banca:</strong> Trocar "fundamentos" por "objetivos". Exemplo: dizer que "erradicar a pobreza" é fundamento. <strong>ERRADO!</strong> É objetivo.
                    </div>
                    <a href="questoes.html?materia=direito-constitucional&modulo=modulo-3&aula=aula-1" target="_blank" class="btn-praticar">📝 Praticar questões desta aula</a>
                `
            }
        },
        "modulo-4": {
            "aula-1": {
                titulo: "Direitos e Garantias Fundamentais (Art. 5º)",
                conteudo: `
                    <h2>📌 Conceito</h2>
                    <p>O art. 5º da CF/88 trata dos <strong>direitos e garantias fundamentais</strong>.</p>
                    <h2>🔍 Explicação Aprofundada</h2>
                    <p><strong>Direitos:</strong> vida, igualdade, liberdade, segurança, propriedade.</p>
                    <p><strong>Garantias:</strong> habeas corpus, mandado de segurança, habeas data, mandado de injunção, ação popular.</p>
                    <p><strong>Cláusulas pétreas:</strong> os direitos e garantias individuais são cláusulas pétreas (art. 60, §4º).</p>
                    <div class="secao macete">
                        <strong>🧠 Macete (Garantias):</strong> "HMSA" — <strong>H</strong>abeas corpus, <strong>M</strong>andado de segurança, <strong>S</strong>egurança, <strong>A</strong>ção popular.
                    </div>
                    <div class="secao pegadinha">
                        <strong>⚠️ Pegadinha da Banca:</strong> Dizer que "prisão civil por dívida é admitida no Brasil". <strong>ERRADO!</strong> Só para depositário infiel e alimentante (art. 5º, LXVII).
                    </div>
                    <a href="questoes.html?materia=direito-constitucional&modulo=modulo-4&aula=aula-1" target="_blank" class="btn-praticar">📝 Praticar questões desta aula</a>
                `
            }
        },
        "modulo-5": {
            "aula-1": {
                titulo: "Organização do Estado (Arts. 18 a 36)",
                conteudo: `
                    <h2>📌 Conceito</h2>
                    <p>O Brasil é uma <strong>federação</strong> formada pela União, Estados, Distrito Federal e Municípios.</p>
                    <h2>🔍 Explicação Aprofundada</h2>
                    <p><strong>Competências:</strong></p>
                    <ul>
                        <li><strong>Exclusivas da União:</strong> art. 21 (moeda, política externa).</li>
                        <li><strong>Privativas da União:</strong> art. 22 (direito penal, civil).</li>
                        <li><strong>Comuns:</strong> art. 23 (saúde, educação).</li>
                        <li><strong>Concorrentes:</strong> art. 24 (União, Estados e DF legislam).</li>
                        <li><strong>Residuais dos Estados:</strong> o que não é da União.</li>
                    </ul>
                    <div class="secao pegadinha">
                        <strong>⚠️ Pegadinha da Banca:</strong> Dizer que a competência privativa da União é <strong>indelegável</strong>. <strong>ERRADO!</strong> Pode ser delegada aos Estados.
                    </div>
                    <div class="secao atencao">
                        <strong>📌 Atenção:</strong> O DF é um ente <strong>sui generis</strong> — não é estado, não é município. É regido por <strong>Lei Orgânica</strong>.
                    </div>
                    <a href="questoes.html?materia=direito-constitucional&modulo=modulo-5&aula=aula-1" target="_blank" class="btn-praticar">📝 Praticar questões desta aula</a>
                `
            }
        }
    },
    "direito-administrativo": {
        "modulo-1": {
            "aula-1": {
                titulo: "Princípios da Administração Pública (LIMPE)",
                conteudo: `
                    <h2>📌 Conceito</h2>
                    <p>Os princípios da Administração Pública estão no <strong>art. 37, caput, da CF/88</strong>.</p>
                    <h2>🔍 Explicação Aprofundada</h2>
                    <ul>
                        <li><strong>Legalidade:</strong> O administrador só pode fazer o que a lei autoriza.</li>
                        <li><strong>Impessoalidade:</strong> Atuação objetiva, veda nepotismo.</li>
                        <li><strong>Moralidade:</strong> Exige probidade, honestidade, boa-fé.</li>
                        <li><strong>Publicidade:</strong> Atos devem ser divulgados, salvo sigilo.</li>
                        <li><strong>Eficiência:</strong> Exige resultados, economicidade, celeridade (EC 19/98).</li>
                    </ul>
                    <div class="secao macete">
                        <strong>🧠 Macete:</strong> "LIMPE" — <strong>L</strong>egalidade, <strong>I</strong>mpessoalidade, <strong>M</strong>oralidade, <strong>P</strong>ublicidade, <strong>E</strong>ficiência.
                    </div>
                    <div class="secao pegadinha">
                        <strong>⚠️ Pegadinha da Banca:</strong> Dizer que a publicidade é <strong>absoluta</strong>. <strong>ERRADO!</strong> Há exceções (sigilo).
                    </div>
                    <div class="secao atencao">
                        <strong>📌 Atenção:</strong> A eficiência foi inserida pela <strong>EC 19/98</strong>.
                    </div>
                    <a href="questoes.html?materia=direito-administrativo&modulo=modulo-1&aula=aula-1" target="_blank" class="btn-praticar">📝 Praticar questões desta aula</a>
                `
            }
        }
    }
};

// ============================================================
// FUNÇÃO PARA CARREGAR A AULA
// ============================================================
function carregarAula() {
    const materia = document.getElementById('filtroMateriaEstudo').value;
    const modulo = document.getElementById('filtroModuloEstudo').value;
    const aula = document.getElementById('filtroAulaEstudo').value;

    const dadosMateria = AULAS[materia];
    if (!dadosMateria) { document.getElementById('painelAula').innerHTML = '<p>Matéria não encontrada.</p>'; return; }
    const dadosModulo = dadosMateria[modulo];
    if (!dadosModulo) { document.getElementById('painelAula').innerHTML = '<p>Módulo não encontrado.</p>'; return; }
    const dadosAula = dadosModulo[aula];
    if (!dadosAula) { document.getElementById('painelAula').innerHTML = '<p>Aula não encontrada.</p>'; return; }

    const container = document.getElementById('painelAula');
    container.innerHTML = `
        <div class="aula-card">
            <h2>📖 ${dadosAula.titulo}</h2>
            ${dadosAula.conteudo}
        </div>
    `;
}

// ============================================================
// CARREGAR AULA AO INICIAR (primeira aula disponível)
// ============================================================
window.onload = function() {
    // Define valores padrão (Direito Constitucional, Módulo 1, Aula 1)
    document.getElementById('filtroMateriaEstudo').value = 'direito-constitucional';
    document.getElementById('filtroModuloEstudo').value = 'modulo-1';
    document.getElementById('filtroAulaEstudo').value = 'aula-1';
    carregarAula();
};
</script>

                    <div class="secao macete"><strong>🧠 Macete:</strong> PEDRO É FERA (Promulgada, Escrita, Dogmática, Rígida, Analítica, Formal).</div>

// FUNÇÃO PARA CARREGAR A AULA
// ============================================================
function carregarAula() {
    const materia = document.getElementById('filtroMateriaEstudo').value;
    const modulo = document.getElementById('filtroModuloEstudo').value;
    const aula = document.getElementById('filtroAulaEstudo').value;

    const dadosMateria = AULAS[materia];
    if (!dadosMateria) { document.getElementById('painelAula').innerHTML = '<p>Matéria não encontrada.</p>'; return; }
    const dadosModulo = dadosMateria[modulo];
    if (!dadosModulo) { document.getElementById('painelAula').innerHTML = '<p>Módulo não encontrado.</p>'; return; }
    const dadosAula = dadosModulo[aula];
    if (!dadosAula) { document.getElementById('painelAula').innerHTML = '<p>Aula não encontrada.</p>'; return; }

    const container = document.getElementById('painelAula');
    container.innerHTML = `
        <div class="aula-card">
            <h2>📖 ${dadosAula.titulo}</h2>
            ${dadosAula.conteudo}
            <a href="../questoes.html" target="_blank" class="btn-praticar">📝 Praticar questões</a>
        </div>
    `;
}

window.onload = carregarAula;
</script>
