                    <h2>📌 Conceito</h2>
                    <p><strong>Compreensão</strong> é a extração de informações explícitas do texto. <strong>Interpretação</strong> é a captação de ideias implícitas, inferências, pressupostos e subentendidos.</p>
                    <h2>🔍 Explicação Aprofundada</h2>
                    <p><strong>Diferença:</strong> Compreensão = "o que está escrito". Interpretação = "o que o autor quis dizer".</p>
                    <p><strong>Tipos textuais:</strong></p>
                    <ul>
                        <li><strong>Narrativo:</strong> conta uma história (personagens, tempo, espaço). Estrutura: apresentação, complicação, clímax, desfecho.</li>

                        <li><strong>Dissertativo:</strong> expõe ideias e argumentos (tese, antítese, conclusão).</li>
                        <li><strong>Injuntivo:</strong> orienta, instrui (manuais, receitas).</li>
                    </ul>
                    <p><strong>Marcadores textuais:</strong> "portanto" (conclusão), "contudo" (oposição), "assim" (consequência).</p>
                    <div class="secao macete">

                    </div>
                    <div class="secao pegadinha">

                    </div>
                    <div class="secao atencao">

                        <li>Interpretação = implícito/inferência.</li>
