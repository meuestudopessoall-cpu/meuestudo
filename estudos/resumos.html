<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('conteudoResumos');
    const filtroInfo = document.getElementById('filtroInfo');

    if (typeof DADOS === 'undefined') {
        container.innerHTML = '<p style="color:red;">Erro: dados não carregados.</p>';
        return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const materiaSigla = urlParams.get('materia');

    const nomesMaterias = {
        'lingua-portuguesa': 'Língua Portuguesa',
        'direito-constitucional': 'Direito Constitucional',
        'direito-administrativo': 'Direito Administrativo',
        'direito-penal': 'Direito Penal',
        'direito-processual-penal': 'Direito Processual Penal',
        'legislacao-penal-especial': 'Legislação Penal Especial',
        'direitos-humanos': 'Direitos Humanos',
        'raciocinio-logico': 'Raciocínio Lógico-Matemático',
        'informatica': 'Informática',
        'lodf': 'Lei Orgânica do DF (LODF)',
        'ride': 'RIDE',
        'lc-840': 'LC 840/2011',
        'eca': 'ECA — Estatuto da Criança e do Adolescente'
    };

    let html = '';
    let materiaEncontrada = false;

    const materiasParaExibir = materiaSigla ? { [materiaSigla]: DADOS.materias[materiaSigla] } : DADOS.materias;

    for (const [sigla, materia] of Object.entries(materiasParaExibir)) {
        if (!materia) continue;
        materiaEncontrada = true;
        const nome = nomesMaterias[sigla] || materia.nome || sigla;
        html += `<h2 class="materia-titulo">📘 ${nome}</h2>`;

        let temConteudo = false;
        for (const modulo of Object.values(materia.modulos || {})) {
            for (const aula of Object.values(modulo.aulas || {})) {
                if (aula.resumo && aula.resumo.length > 10) temConteudo = true;
            }
        }

        if (!temConteudo) {
            html += `<div class="sem-conteudo">📌 Conteúdo desta matéria será adicionado em breve.</div>`;
        }

        for (const [moduloId, modulo] of Object.entries(materia.modulos || {})) {
            html += `<h3 class="modulo-titulo">📌 ${modulo.nome}</h3>`;
            for (const [aulaId, aula] of Object.entries(modulo.aulas || {})) {
                html += `<div class="aula-titulo">▶ ${aula.nome}</div>`;
                const resumo = aula.resumo || 'Conteúdo em breve...';
                html += `<div class="resumo-box">${resumo}</div>`;
            }
        }
    }

    if (!materiaEncontrada) {
        container.innerHTML = '<p>Nenhuma matéria encontrada.</p>';
    } else {
        container.innerHTML = html;
    }

    if (materiaSigla) {
        const nome = nomesMaterias[materiaSigla] || 'Matéria';
        filtroInfo.innerHTML = `<span style="background:#e8f0fe;padding:4px 16px;border-radius:20px;">🔍 Exibindo apenas: <strong>${nome}</strong></span>`;
    }
});
</script>
