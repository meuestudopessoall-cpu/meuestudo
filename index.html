<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FUTURO APROVADO</title>

<meta name="description" content="Futuro Aprovado — plataforma pessoal de estudos">
<meta name="theme-color" content="#050914">

<style>

/* =========================================================
   FUTURO APROVADO — V2
   ========================================================= */

:root{
    --bg:#050914;
    --bg2:#08111f;
    --card:#0b1627;
    --card2:#0e1c30;

    --blue:#168cff;
    --blue2:#0067ff;
    --cyan:#43d9ff;

    --green:#38d89a;
    --yellow:#ffc857;
    --red:#ff5c7a;
    --purple:#9d7cff;

    --white:#f7faff;
    --text:#c3cfdd;
    --muted:#718198;

    --border:rgba(255,255,255,.08);

    --radius:22px;

    --shadow:
        0 25px 70px rgba(0,0,0,.38);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--white);

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(22,140,255,.15),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(67,217,255,.07),
            transparent 25%
        ),

        var(--bg);

    overflow-x:hidden;
}

button{
    font:inherit;
}

button:disabled{
    cursor:not-allowed;
}

.hidden{
    display:none!important;
}


/* =========================================================
   FUNDO
   ========================================================= */

.background-glow{
    position:fixed;

    width:400px;
    height:400px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.10;

    pointer-events:none;

    z-index:-1;
}

.glow1{
    background:#008cff;

    top:5%;
    left:-220px;
}

.glow2{
    background:#00d5ff;

    right:-220px;
    bottom:5%;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:sticky;

    top:0;

    z-index:1000;

    height:76px;

    padding:0 5%;

    display:flex;
    align-items:center;

    background:
        rgba(5,9,20,.86);

    backdrop-filter:blur(20px);

    border-bottom:
        1px solid var(--border);
}


/* =========================================================
   MARCA
   ========================================================= */

.brand{
    display:flex;
    align-items:center;

    gap:12px;

    cursor:pointer;

    user-select:none;
}

.brand-icon{
    width:46px;
    height:46px;

    display:grid;
    place-items:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue2)
        );

    box-shadow:
        0 0 35px
        rgba(22,140,255,.28);

    font-size:21px;
}

.brand-name{
    font-size:15px;

    font-weight:1000;

    letter-spacing:.8px;
}

.brand-sub{
    margin-top:3px;

    color:var(--muted);

    font-size:8px;

    font-weight:800;

    letter-spacing:1.4px;

    text-transform:uppercase;
}


/* =========================================================
   NAVEGAÇÃO
   ========================================================= */

.nav{
    margin-left:auto;

    display:flex;
    align-items:center;

    gap:3px;
}

.nav-btn{
    border:0;

    background:transparent;

    color:var(--muted);

    padding:10px 13px;

    border-radius:11px;

    cursor:pointer;

    font-size:10px;

    font-weight:900;

    transition:.2s;
}

.nav-btn:hover{
    color:white;

    background:
        rgba(255,255,255,.05);
}

.nav-btn.active{
    color:white;

    background:
        rgba(22,140,255,.13);
}

.mobile-btn{
    display:none;

    margin-left:auto;

    width:43px;
    height:43px;

    border:1px solid var(--border);

    border-radius:13px;

    background:
        rgba(255,255,255,.04);

    color:white;

    cursor:pointer;

    font-size:19px;
}


/* =========================================================
   CONTAINER
   ========================================================= */

.container{
    width:min(1180px,90%);

    margin:auto;
}


/* =========================================================
   PÁGINAS
   ========================================================= */

.page{
    display:none;

    min-height:calc(100vh - 76px);

    padding:
        55px 0
        90px;

    animation:
        pageIn .35s ease;
}

.page.active{
    display:block;
}

@keyframes pageIn{

    from{
        opacity:0;

        transform:
            translateY(12px);
    }

    to{
        opacity:1;

        transform:
            translateY(0);
    }

}


/* =========================================================
   HERO
   ========================================================= */

.hero{
    min-height:430px;

    display:grid;

    grid-template-columns:
        1.1fr .9fr;

    gap:50px;

    align-items:center;
}

.status{
    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:8px 13px;

    border:
        1px solid
        rgba(22,140,255,.18);

    border-radius:999px;

    background:
        rgba(22,140,255,.06);

    color:#8bdcff;

    font-size:9px;

    font-weight:950;

    letter-spacing:1px;

    text-transform:uppercase;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 13px
        var(--green);

    animation:pulse 1.8s infinite;
}

.hero h1{
    margin-top:22px;

    font-size:
        clamp(
            46px,
            6vw,
            75px
        );

    line-height:.94;

    letter-spacing:-4px;

    font-weight:1000;
}

.gradient{
    background:
        linear-gradient(
            100deg,
            white,
            #a5e0ff,
            var(--blue),
            #72e6ff,
            white
        );

    background-size:250% auto;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:
        gradientMove 6s linear infinite;
}

.hero-text{
    max-width:610px;

    margin-top:24px;

    color:var(--text);

    font-size:14px;

    line-height:1.85;
}

.hero-actions{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:28px;
}


/* =========================================================
   BOTÕES
   ========================================================= */

.btn{
    border:0;

    padding:13px 18px;

    border-radius:13px;

    cursor:pointer;

    font-size:10px;

    font-weight:950;

    transition:.22s;
}

.btn:hover{
    transform:
        translateY(-3px);
}

.btn-primary{
    color:white;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue2)
        );

    box-shadow:
        0 14px 35px
        rgba(0,103,255,.25);
}

.btn-secondary{
    color:white;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid var(--border);
}


/* =========================================================
   VISUAL DO HERO
   ========================================================= */

.hero-visual{
    min-height:350px;

    position:relative;

    display:grid;

    place-items:center;
}

.orbit{
    position:absolute;

    width:320px;
    height:320px;

    border:
        1px solid
        rgba(22,140,255,.13);

    border-radius:50%;

    animation:
        rotate 15s linear infinite;
}

.orbit::before{
    content:"";

    position:absolute;

    width:9px;
    height:9px;

    border-radius:50%;

    background:var(--cyan);

    box-shadow:
        0 0 20px
        var(--cyan);

    top:25px;
    left:55px;
}

.orbit.small{
    width:225px;
    height:225px;

    animation-direction:reverse;

    animation-duration:11s;

    border-color:
        rgba(67,217,255,.10);
}

.orbit.small::before{
    top:auto;
    left:auto;

    right:25px;
    bottom:15px;

    background:var(--blue);
}

.future-card{
    position:relative;

    z-index:2;

    width:min(330px,100%);

    padding:31px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(17,42,70,.94),
            rgba(7,15,27,.96)
        );

    box-shadow:var(--shadow);

    animation:
        floating 5s ease-in-out infinite;
}

.future-icon{
    width:65px;
    height:65px;

    display:grid;
    place-items:center;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue2)
        );

    font-size:28px;

    box-shadow:
        0 0 35px
        rgba(22,140,255,.28);
}

.future-card h2{
    margin-top:22px;

    font-size:24px;

    letter-spacing:-1px;
}

.future-card p{
    margin-top:9px;

    color:var(--muted);

    font-size:11px;

    line-height:1.7;
}

.quote{
    margin-top:20px;

    padding:14px;

    border-left:
        3px solid
        var(--blue);

    background:
        rgba(22,140,255,.06);

    color:#c9d7e6;

    font-size:10px;

    line-height:1.65;
}


/* =========================================================
   MISSÃO
   ========================================================= */

.mission{
    margin-bottom:50px;

    padding:22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    border:
        1px solid
        rgba(255,200,87,.14);

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(255,200,87,.06),
            rgba(255,255,255,.02)
        );
}

.mission-left{
    display:flex;

    align-items:center;

    gap:14px;
}

.mission-icon{
    width:54px;
    height:54px;

    display:grid;
    place-items:center;

    border-radius:16px;

    background:
        rgba(255,200,87,.08);

    font-size:23px;
}

.mission small{
    color:var(--yellow);

    font-size:8px;

    font-weight:950;

    letter-spacing:1px;

    text-transform:uppercase;
}

.mission strong{
    display:block;

    margin-top:5px;

    font-size:14px;
}

.mission p{
    margin-top:4px;

    color:var(--muted);

    font-size:9px;
}


/* =========================================================
   TÍTULOS
   ========================================================= */

.section-title{
    margin-bottom:22px;
}

.section-title h2{
    font-size:27px;

    letter-spacing:-.8px;
}

.section-title p{
    margin-top:6px;

    color:var(--muted);

    font-size:10px;
}


/* =========================================================
   GRID
   ========================================================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;
}


/* =========================================================
   CARD
   ========================================================= */

.card{
    padding:22px;

    border:
        1px solid
        var(--border);

    border-radius:21px;

    background:
        rgba(11,22,39,.76);

    transition:.25s;
}

.card:hover{
    transform:
        translateY(-6px);

    background:
        var(--card2);

    border-color:
        rgba(22,140,255,.25);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.28);
}


/* =========================================================
   MATÉRIA
   ========================================================= */

.subject{
    min-height:205px;

    cursor:pointer;
}

.subject-top{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;
}

.subject-icon{
    width:49px;
    height:49px;

    display:grid;
    place-items:center;

    border-radius:15px;

    background:
        rgba(22,140,255,.09);

    border:
        1px solid
        rgba(22,140,255,.13);

    font-size:21px;
}

.subject-number{
    color:var(--muted);

    font-size:9px;

    font-weight:950;
}

.subject h3{
    margin-top:18px;

    font-size:14px;
}

.subject p{
    margin-top:7px;

    color:var(--muted);

    font-size:10px;

    line-height:1.55;
}


/* =========================================================
   PROGRESSO
   ========================================================= */

.progress{
    height:7px;

    overflow:hidden;

    border-radius:999px;

    background:
        rgba(255,255,255,.055);
}

.progress-fill{
    height:100%;

    width:0%;

    border-radius:inherit;

    background:
        linear-gradient(
            90deg,
            var(--blue2),
            var(--cyan)
        );

    box-shadow:
        0 0 17px
        rgba(22,140,255,.3);

    transition:
        width 1s
        cubic-bezier(.22,1,.36,1);
}

.subject-progress{
    margin-top:18px;
}

.progress-label{
    display:flex;

    justify-content:space-between;

    margin-top:7px;

    color:var(--muted);

    font-size:8px;

    font-weight:850;
}


/* =========================================================
   ESTATÍSTICAS
   ========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;
}

.stat{
    padding:21px;

    border:
        1px solid var(--border);

    border-radius:19px;

    background:
        rgba(255,255,255,.03);
}

.stat-icon{
    font-size:18px;
}

.stat-value{
    margin-top:9px;

    font-size:28px;

    font-weight:1000;
}

.stat-label{
    margin-top:3px;

    color:var(--muted);

    font-size:8px;

    font-weight:950;

    letter-spacing:.5px;
}


/* =========================================================
   ESTUDO
   ========================================================= */

.study-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin-bottom:24px;
}

.study-title{
    display:flex;

    align-items:center;

    gap:14px;
}

.study-icon{
    width:58px;
    height:58px;

    display:grid;
    place-items:center;

    border-radius:17px;

    background:
        rgba(22,140,255,.10);

    font-size:25px;
}

.study-title h2{
    font-size:25px;
}

.study-title p{
    margin-top:4px;

    color:var(--muted);

    font-size:9
