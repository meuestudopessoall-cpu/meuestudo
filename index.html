<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Futuro Aprovado | Trilha Policial 2026</title>

<meta
    name="description"
    content="Painel pessoal de estudos para concursos policiais."
>

<meta
    name="theme-color"
    content="#050b14"
>

<style>

/* =========================================================
   FUTURO APROVADO
   ========================================================= */

:root{

    --bg:#050b14;
    --bg2:#081525;

    --card:#0c1a2b;
    --card2:#10243b;

    --primary:#159cff;
    --primary2:#0068ff;
    --cyan:#39d9ff;

    --green:#31df9a;
    --yellow:#ffc857;
    --red:#ff5573;

    --text:#f5f8ff;
    --muted:#8294aa;

    --border:rgba(255,255,255,.08);

    --shadow:
        0 20px 60px rgba(0,0,0,.35);

}


/* =========================================================
   RESET
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(21,156,255,.14),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 25%,
            rgba(57,217,255,.08),
            transparent 25%
        ),

        linear-gradient(
            145deg,
            var(--bg),
            var(--bg2)
        );

    color:var(--text);

    min-height:100vh;

}

button{
    font-family:inherit;
}

button:disabled{
    cursor:not-allowed;
}

.hidden{
    display:none !important;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{

    position:sticky;

    top:0;

    z-index:1000;

    height:74px;

    display:flex;

    align-items:center;

    padding:0 5%;

    background:
        rgba(5,11,20,.84);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid var(--border);

}


/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:12px;

    cursor:pointer;

    user-select:none;

}

.logo-icon{

    width:43px;
    height:43px;

    display:grid;

    place-items:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    box-shadow:
        0 0 28px
        rgba(21,156,255,.28);

    font-size:21px;

}

.logo-main{

    font-size:16px;

    font-weight:950;

    letter-spacing:.8px;

}

.logo-sub{

    display:block;

    margin-top:4px;

    color:var(--muted);

    font-size:9px;

    font-weight:800;

    letter-spacing:1px;

    text-transform:uppercase;

}


/* =========================================================
   NAV
   ========================================================= */

.nav{

    margin-left:auto;

    display:flex;

    gap:5px;

}

.nav button{

    border:0;

    background:transparent;

    color:var(--muted);

    padding:10px 13px;

    border-radius:11px;

    cursor:pointer;

    font-size:12px;

    font-weight:800;

    transition:
        color .2s ease,
        background .2s ease,
        transform .2s ease;

}

.nav button:hover{

    color:white;

    background:
        rgba(255,255,255,.05);

    transform:
        translateY(-1px);

}

.nav button.active{

    color:white;

    background:
        rgba(21,156,255,.13);

}


/* MENU MOBILE */

.menu-button{

    display:none;

    margin-left:auto;

    width:42px;

    height:42px;

    border:1px solid var(--border);

    border-radius:12px;

    background:
        rgba(255,255,255,.04);

    color:white;

    cursor:pointer;

    font-size:20px;

}


/* =========================================================
   APP
   ========================================================= */

.app{

    width:min(
        1180px,
        90%
    );

    margin:auto;

}

.page{

    display:none;

    padding:
        55px 0
        80px;

    animation:
        pageIn .4s ease;

}

.page.active{
    display:block;
}


/* =========================================================
   HERO
   ========================================================= */

.hero{

    display:grid;

    grid-template-columns:
        1.15fr .85fr;

    gap:45px;

    align-items:center;

    min-height:390px;

}

.badge{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:8px 13px;

    border-radius:999px;

    border:
        1px solid
        rgba(21,156,255,.20);

    background:
        rgba(21,156,255,.07);

    color:#75ccff;

    font-size:10px;

    font-weight:900;

    letter-spacing:.8px;

    text-transform:uppercase;

}

.badge-dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 12px var(--green);

    animation:
        pulse 1.8s infinite;

}

.hero h1{

    margin-top:22px;

    font-size:
        clamp(
            43px,
            6vw,
            72px
        );

    line-height:.94;

    letter-spacing:-3px;

    font-weight:950;

}

.gradient{

    background:

        linear-gradient(
            100deg,
            #fff,
            #7dd5ff,
            #159cff,
            #b0eaff
        );

    background-size:200% auto;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:
        gradientMove 5s linear infinite;

}

.hero p{

    margin-top:23px;

    max-width:620px;

    color:var(--muted);

    line-height:1.7;

    font-size:15px;

}

.actions{

    display:flex;

    flex-wrap:wrap;

    gap:12px;

    margin-top:28px;

}


/* =========================================================
   BUTTONS
   ========================================================= */

.btn{

    border:0;

    border-radius:13px;

    padding:
        13px 18px;

    cursor:pointer;

    font-size:12px;

    font-weight:900;

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        background .22s ease;

}

.btn:hover{

    transform:
        translateY(-3px);

}

.btn-primary{

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    box-shadow:
        0 12px 30px
        rgba(0,104,255,.25);

}

.btn-primary:hover{

    box-shadow:
        0 16px 38px
        rgba(0,104,255,.38);

}

.btn-secondary{

    color:white;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid var(--border);

}


/* =========================================================
   HERO CARD
   ========================================================= */

.hero-card{

    min-height:300px;

    padding:30px;

    border-radius:30px;

    border:
        1px solid var(--border);

    background:

        linear-gradient(
            145deg,
            rgba(18,48,78,.82),
            rgba(7,18,31,.90)
        );

    box-shadow:
        var(--shadow);

    animation:
        floating 5s ease-in-out infinite;

}

.hero-icon{

    width:64px;

    height:64px;

    display:grid;

    place-items:center;

    border-radius:19px;

    background:
        rgba(21,156,255,.10);

    border:
        1px solid
        rgba(21,156,255,.16);

    font-size:30px;

}

.hero-card h2{

    margin-top:22px;

    font-size:23px;

}

.hero-card p{

    margin-top:9px;

    color:var(--muted);

    line-height:1.6;

    font-size:13px;

}

.quote{

    margin-top:24px;

    padding:14px;

    border-left:
        3px solid
        var(--primary);

    background:
        rgba(21,156,255,.06);

    color:#b9c9db;

    font-size:12px;

    line-height:1.6;

}


/* =========================================================
   TITLES
   ========================================================= */

.title{

    margin-bottom:24px;

}

.title h2{

    font-size:27px;

    letter-spacing:-.7px;

}

.title p{

    margin-top:6px;

    color:var(--muted);

    font-size:12px;

}


/* =========================================================
   GRID
   ========================================================= */

.grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

}


/* =========================================================
   CARD
   ========================================================= */

.card{

    padding:22px;

    border:
        1px solid var(--border);

    border-radius:21px;

    background:
        rgba(13,27,45,.78);

    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

}

.card:hover{

    transform:
        translateY(-6px);

    background:
        var(--card2);

    border-color:
        rgba(21,156,255,.25);

    box-shadow:
        0 18px 40px
        rgba(0,0,0,.25);

}


/* =========================================================
   SUBJECT CARD
   ========================================================= */

.subject{

    min-height:190px;

    cursor:pointer;

}

.subject-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

}

.subject-icon{

    width:47px;

    height:47px;

    display:grid;

    place-items:center;

    border-radius:14px;

    background:
        rgba(21,156,255,.09);

    border:
        1px solid
        rgba(21,156,255,.14);

    font-size:21px;

}

.subject-number{

    color:var(--muted);

    font-size:10px;

    font-weight:900;

}

.subject h3{

    margin-top:18px;

    font-size:16px;

}

.subject p{

    margin-top:7px;

    color:var(--muted);

    font-size:11px;

    line-height:1.5;

}


/* =========================================================
   PROGRESS BAR
   ========================================================= */

.progress{

    height:7px;

    background:
        rgba(255,255,255,.06);

    border-radius:999px;

    overflow:hidden;

}

.progress-fill{

    height:100%;

    width:0%;

    border-radius:inherit;

    background:
        linear-gradient(
            90deg,
            var(--primary2),
            var(--cyan)
        );

    box-shadow:
        0 0 16px
        rgba(21,156,255,.30);

    transition:
        width 1s
        cubic-bezier(.22,1,.36,1);

}

.subject-progress{

    margin-top:18px;

}

.progress-text{

    display:flex;

    justify-content:space-between;

    margin-top:6px;

    color:var(--muted);

    font-size:9px;

    font-weight:800;

}


/* =========================================================
   NEXT CARD
   ========================================================= */

.next{

    padding:24px;

    border-radius:22px;

    border:
        1px solid
        rgba(255,200,87,.12);

    background:

        linear-gradient(
            135deg,
            rgba(255,200,87,.07),
            rgba(255,255,255,.025)
        );

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

}

.next-info{

    display:flex;

    align-items:center;

    gap:14px;

}

.next-icon{

    width:52px;

    height:52px;

    display:grid;

    place-items:center;

    border-radius:15px;

    background:
        rgba(255,200,87,.10);

    font-size:23px;

}

.next small{

    color:var(--muted);

    font-size:9px;

    font-weight:900;

    text-transform:uppercase;

}

.next strong{

    display:block;

    margin-top:4px;

    font-size:15px;

}


/* =========================================================
   STATS
   ========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;

}

.stat{

    padding:22px;

    border-radius:19px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.035);

}

.stat-icon{

    font-size:18px;

}

.stat-value{

    margin-top:10px;

    font-size:30px;

    font-weight:950;

}

.stat-label{

    margin-top:4px;

    color:var(--muted);

    font-size:9px;

    font-weight:900;

}


/* =========================================================
   BIG PROGRESS
   ========================================================= */

.big-progress{

    margin-top:16px;

    padding:25px;

    border-radius:22px;

    border:
        1px solid
        rgba(21,156,255,.13);

    background:

        linear-gradient(
            135deg,
            rgba(21,156,255,.08),
            rgba(255,255,255,.025)
        );

}

.big-progress-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.big-progress-title{

    font-size:13px;

    font-weight:900;

}

.percent{

    color:var(--cyan);

    font-weight:950;

}


/* =========================================================
   STUDY PAGE
   ========================================================= */

.study-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;

}

.study-title{

    display:flex;

    align-items:center;

    gap:14px;

}

.study-title-icon{

    width:58px;

    height:58px;

    display:grid;

    place-items:center;

    border-radius:17px;

    background:
        rgba(21,156,255,.10);

    font-size:26px;

}

.study-title h2{

    font-size:25px;

}

.study-title p{

    margin-top:4px;

    color:var(--muted);

    font-size:11px;

}


/* =========================================================
   LESSON
   ========================================================= */

.lesson{

    padding:28px;

    border-radius:22px;

    border:
        1px solid var(--border);

    background:
        rgba(13,27,45,.80);

}

.lesson + .lesson{

    margin-top:15px;

}

.lesson h3{

    font-size:18px;

}

.lesson h4{

    margin-top:20px;

    font-size:14px;

    color:#8bdcff;

}

.lesson p{

    margin-top:10px;

    color:#aebed0;

    font-size:13px;

    line-height:1.8;

}

.example{

    margin-top:16px;

    padding:16px;

    border-radius:13px;

    background:
        rgba(21,156,255,.06);

    border-left:
        3px solid var(--primary);

}

.example strong{

    color:white;

    font-size:11px;

}

.example p{

    margin-top:5px;

    font-size:12px;

}


/* =========================================================
   QUESTIONS
   ========================================================= */

.question{

    margin-top:18px;

    padding:18px;

    border-radius:15px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid var(--border);

}

.question p{

    margin-top:0;

    color:white;

    font-weight:800;

}

.option{

    display:block;

    width:100%;

    margin-top:9px;

    padding:11px 13px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:
        rgba(255,255,255,.025);

    color:#c7d4e2;

    text-align:left;

    cursor:pointer;

    transition:.2s;

    font-size:11px;

}

.option:hover{

    background:
        rgba(21,156,255,.08);

    border-color:
        rgba(21,156,255,.30);

}

.option.correct{

    background:
        rgba(49,223,154,.10);

    border-color:
        var(--green);

    color:#8ff0c4;

}

.option.wrong{

    background:
        rgba(255,85,115,.10);

    border-color:
        var(--red);

    color:#ff9aad;

}

.feedback{

    margin-top:12px;

    padding:12px;

    border-radius:10px;

    background:
        rgba(255,255,255,.035);

    color:var(--muted);

    font-size:11px;

    line-height:1.6;

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer{

    padding:
        35px 0
        70px;

    text-align:center;

    color:var(--muted);

    font-size:10px;

}

.footer strong{

    color:#cbd8e6;

}


/* =========================================================
   TOAST
   ========================================================= */

.toast{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:
        translate(-50%,20px);

    opacity:0;

    z-index:5000;

    padding:
        13px 18px;

    border-radius:13px;

    background:
        rgba(10,22,37,.95);

    border:
        1px solid
        rgba(21,156,255,.25);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    color:white;

    font-size:11px;

    font-weight:800;

    pointer-events:none;

    transition:
        .3s ease;

}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes pageIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }

}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.4);
        opacity:.6;
    }

}

@keyframes gradientMove{

    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:200% 50%;
    }

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px){

    .hero{

        grid-template-columns:1fr;

    }

    .hero-card{

        display:none;

    }

    .grid{

        grid-template-columns:
            repeat(2,1fr);

    }

    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }

}


@media(max-width:650px){

    .header{

        height:68px;

    }

    .nav{

        position:absolute;

        top:68px;

        left:0;

        right:0;

        display:none;

        flex-direction:column;

        padding:
            10px 5%
            15px;

        background:
            rgba(5,11,20,.97);

        border-bottom:
            1px solid var(--border);

    }

    .nav.open{

        display:flex;

    }

    .nav button{

        text-align:left;

        padding:13px;

    }

    .menu-button{

        display:block;

    }

    .hero h1{

        font-size:47px;

    }

    .grid{

        grid-template-columns:1fr;

    }

    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }

    .study-header{

        align-items:flex-start;

        flex-direction:column;

    }

    .next{

        align-items:flex-start;

        flex-direction:column;

    }

}

@media(max-width:390px){

    .hero h1{

        font-size:40px;

    }

    .stats{

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">


    <!--
        ESTE É O MENU PRINCIPAL.
        CLICAR NO LOGO SEMPRE VOLTA PARA O INÍCIO.
    -->

    <div
        class="logo"
        onclick="goHome()"
    >

        <div class="logo-icon">
            🎯
        </div>

        <div>

            <div class="logo-main">
                FUTURO APROVADO
            </div>

            <div class="logo-sub">
                Trilha Policial 2026
            </div>

        </div>

    </div>


    <!-- MENU -->

    <nav
        class="nav"
        id="mainNav"
    >

        <button
            id="nav-home"
            class="active"
            onclick="navigate('home')"
        >
            🏠 Início
        </button>

        <button
            id="nav-materias"
            onclick="navigate('materias')"
