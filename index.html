<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FUTURO APROVADO | Minha Jornada</title>

<meta name="description" content="Futuro Aprovado — sua plataforma pessoal de preparação.">

<style>

/* =========================================================
   FUTURO APROVADO — V3
   DESIGN PREMIUM
   ========================================================= */

:root{

    --bg:#080b12;
    --bg-soft:#0d111a;

    --surface:#111722;
    --surface-2:#151c29;
    --surface-3:#1a2331;

    --blue:#3b9cff;
    --blue-dark:#1976e8;
    --cyan:#5ddcff;

    --green:#43d69b;
    --yellow:#f4c95d;
    --red:#ff667f;
    --purple:#a98cff;

    --white:#f7f9fc;
    --text:#b8c2d0;
    --muted:#69778b;

    --border:rgba(255,255,255,.075);

    --radius:20px;

    --shadow:
        0 25px 70px rgba(0,0,0,.32);

}


/* =========================================================
   RESET
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color:var(--white);

    background:

        radial-gradient(
            circle at 15% -10%,
            rgba(59,156,255,.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 100% 50%,
            rgba(93,220,255,.05),
            transparent 25%
        ),

        var(--bg);

    overflow-x:hidden;

}

button{
    font:inherit;
}

button:disabled{
    cursor:not-allowed;
}


/* =========================================================
   UTILIDADES
   ========================================================= */

.hidden{
    display:none!important;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{

    position:sticky;

    top:0;

    z-index:1000;

    height:74px;

    display:flex;

    align-items:center;

    padding:0 5%;

    background:
        rgba(8,11,18,.88);

    backdrop-filter:blur(22px);

    border-bottom:
        1px solid var(--border);

}


/* =========================================================
   LOGO
   ========================================================= */

.brand{

    display:flex;

    align-items:center;

    gap:12px;

    cursor:pointer;

}

.brand-mark{

    width:43px;
    height:43px;

    display:grid;

    place-items:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #348ff5,
            #1766d0
        );

    box-shadow:
        0 8px 28px
        rgba(59,156,255,.22);

    font-size:20px;

}

.brand-title{

    font-size:14px;

    font-weight:1000;

    letter-spacing:1px;

}

.brand-sub{

    margin-top:3px;

    color:var(--muted);

    font-size:7px;

    font-weight:800;

    letter-spacing:1.4px;

    text-transform:uppercase;

}


/* =========================================================
   NAVEGAÇÃO
   ========================================================= */

.nav{

    margin-left:auto;

    display:flex;

    gap:4px;

}

.nav-button{

    padding:9px 13px;

    border:0;

    border-radius:10px;

    background:transparent;

    color:var(--muted);

    cursor:pointer;

    font-size:10px;

    font-weight:850;

    transition:.2s;

}

.nav-button:hover{

    color:white;

    background:
        rgba(255,255,255,.045);

}

.nav-button.active{

    color:white;

    background:
        rgba(59,156,255,.11);

}

.mobile-menu{

    display:none;

    margin-left:auto;

    width:42px;
    height:42px;

    border:
        1px solid var(--border);

    border-radius:12px;

    background:
        rgba(255,255,255,.035);

    color:white;

    cursor:pointer;

    font-size:18px;

}


/* =========================================================
   LAYOUT
   ========================================================= */

.container{

    width:min(
        1180px,
        90%
    );

    margin:auto;

}

.page{

    display:none;

    min-height:
        calc(100vh - 74px);

    padding:
        48px 0
        80px;

    animation:
        pageEnter .35s ease;

}

.page.active{
    display:block;
}

@keyframes pageEnter{

    from{

        opacity:0;

        transform:
            translateY(10px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   HERO
   ========================================================= */

.hero{

    display:grid;

    grid-template-columns:
        1.25fr .75fr;

    gap:50px;

    align-items:center;

    min-height:470px;

}

.hero-label{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
        7px 11px;

    border:
        1px solid
        rgba(67,214,155,.15);

    border-radius:100px;

    background:
        rgba(67,214,155,.055);

    color:#7de8ba;

    font-size:8px;

    font-weight:950;

    letter-spacing:1px;

    text-transform:uppercase;

}

.online-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 10px
        var(--green);

}

.hero h1{

    margin-top:22px;

    max-width:700px;

    font-size:
        clamp(
            45px,
            6vw,
            76px
        );

    line-height:.96;

    letter-spacing:-4px;

    font-weight:1000;

}

.hero-highlight{

    color:var(--blue);

}

.hero-description{

    max-width:600px;

    margin-top:23px;

    color:var(--text);

    font-size:13px;

    line-height:1.9;

}

.hero-description strong{
    color:white;
}

.hero-actions{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:27px;

}


/* =========================================================
   BOTÕES
   ========================================================= */

.btn{

    border:0;

    padding:
        12px 17px;

    border-radius:12px;

    cursor:pointer;

    font-size:10px;

    font-weight:950;

    transition:.22s;

}

.btn:hover{

    transform:
        translateY(-2px);

}

.btn-primary{

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-dark)
        );

    box-shadow:
        0 12px 30px
        rgba(59,156,255,.18);

}

.btn-secondary{

    color:#dce5ef;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid var(--border);

}


/* =========================================================
   HERO CARD
   ========================================================= */

.hero-dashboard{

    position:relative;

    padding:22px;

    border:
        1px solid var(--border);

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(21,28,41,.98),
            rgba(11,15,23,.98)
        );

    box-shadow:var(--shadow);

    animation:
        floating 5s ease-in-out infinite;

}

.dashboard-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.dashboard-label{

    color:var(--muted);

    font-size:8px;

    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;

}

.dashboard-date{

    color:#8895a6;

    font-size:8px;

}

.dashboard-score{

    margin-top:24px;

    padding:20px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(59,156,255,.12),
            rgba(59,156,255,.025)
        );

    border:
        1px solid
        rgba(59,156,255,.12);

}

.score-label{

    color:var(--muted);

    font-size:8px;

    font-weight:900;

}

.score-number{

    margin-top:4px;

    font-size:38px;

    font-weight:1000;

}

.score-number span{

    color:var(--muted);

    font-size:13px;

}

.dashboard-line{

    height:1px;

    margin:20px 0;

    background:var(--border);

}

.mini-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px 0;

}

.mini-left{

    display:flex;

    align-items:center;

    gap:9px;

}

.mini-icon{

    width:31px;
    height:31px;

    display:grid;

    place-items:center;

    border-radius:9px;

    background:
        rgba(255,255,255,.045);

    font-size:13px;

}

.mini-name{

    font-size:9px;

    font-weight:800;

}

.mini-progress{

    margin-top:3px;

    color:var(--muted);

    font-size:7px;

}

.mini-percent{

    color:var(--blue);

    font-size:9px;

    font-weight:950;

}


/* =========================================================
   SEÇÕES
   ========================================================= */

.section-header{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:20px;

}

.section-title{

    font-size:25px;

    letter-spacing:-.7px;

}

.section-description{

    margin-top:5px;

    color:var(--muted);

    font-size:9px;

}


/* =========================================================
   MISSÃO
   ========================================================= */

.daily-mission{

    margin-bottom:45px;

    padding:20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    border:
        1px solid
        rgba(244,201,93,.13);

    border-radius:20px;

    background:
        linear-gradient(
            100deg,
            rgba(244,201,93,.055),
            rgba(255,255,255,.02)
        );

}

.mission-info{

    display:flex;

    align-items:center;

    gap:13px;

}

.mission-icon{

    width:50px;
    height:50px;

    display:grid;

    place-items:center;

    border-radius:15px;

    background:
        rgba(244,201,93,.08);

    font-size:21px;

}

.mission-small{

    color:var(--yellow);

    font-size:7px;

    font-weight:950;

    letter-spacing:1px;

    text-transform:uppercase;

}

.mission-title{

    margin-top:4px;

    font-size:12px;

    font-weight:900;

}

.mission-description{

    margin-top:3px;

    color:var(--muted);

    font-size:8px;

}


/* =========================================================
   GRID
   ========================================================= */

.grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

}


/* =========================================================
   CARD BASE
   ========================================================= */

.card{

    padding:21px;

    border:
        1px solid var(--border);

    border-radius:19px;

    background:
        rgba(17,23,34,.82);

    transition:
        transform .25s,
        border-color .25s,
        background .25s;

}

.card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(59,156,255,.20);

    background:
        var(--surface-2);

}


/* =========================================================
   MATÉRIA
   ========================================================= */

.subject-card{

    min-height:205px;

    cursor:pointer;

}

.subject-head{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

}

.subject-icon{

    width:46px;
    height:46px;

    display:grid;

    place-items:center;

    border-radius:14px;

    background:
        rgba(255,255,255,.045);

    font-size:20px;

}

.subject-number{

    color:#445064;

    font-size:8px;

    font-weight:1000;

}

.subject-card h3{

    margin-top:17px;

    font-size:13px;

}

.subject-card p{

    margin-top:6px;

    color:var(--muted);

    font-size:9px;

    line-height:1.6;

}

.progress-wrap{

    margin-top:18px;

}

.progress-bar{

    height:6px;

    overflow:hidden;

    border-radius:100px;

    background:
        rgba(255,255,255,.055);

}

.progress-fill{

    height:100%;

    width:0;

    border-radius:inherit;

    background:
        linear-gradient(
            90deg,
            var(--blue-dark),
            var(--cyan)
        );

    transition:
        width 1s
        cubic-bezier(.22,1,.36,1);

}

.progress-info{

    display:flex;

    justify-content:space-between;

    margin-top:6px;

    color:var(--muted);

    font-size:7px;

    font-weight:850;

}


/* =========================================================
   ESTATÍSTICAS
   ========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:13px;

}

.stat-card{

    padding:19px;

    border:
        1px solid var(--border);

    border-radius:17px;

    background:
        rgba(255,255,255,.025);

}

.stat-icon{

    font-size:16px;

}

.stat-value{

    margin-top:8px;

    font-size:26px;

    font-weight:1000;

}

.stat-label{

    margin-top:2px;

    color:var(--muted);

    font-size:7px;

    font-weight:900;

    letter-spacing:.5px;

}


/* =========================================================
   ESTUDO
   ========================================================= */

.study-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin-bottom:23px;

}

.study-heading{

    display:flex;

    align-items:center;

    gap:13px;

}

.study-symbol{

    width:55px;
    height:55px;

    display:grid;

    place-items:center;

    border-radius:16px;

    background:
        rgba(59,156,255,.09);

    font-size:24px;

}

.study-heading h2{

    font-size:24px;

    letter-spacing:-.7px;

}

.study-heading p{

    margin-top:3px;

    color:var(--muted);

    font-size:8px;

}

.lesson{

    padding:27px;

    border:
        1px solid var(--border);

    border-radius:21px;

    background:
        rgba(17,23,34,.82);

}

.lesson + .lesson{

    margin-top:14px;

}

.lesson h3{

    font-size:17px;

}

.lesson h4{

    margin-top:22px;

    color:#7ccaff;

    font-size:12px;

}

.lesson p{

    margin-top:9px;

    color:#aebaca;

    font-size:11px;

    line-height:1.85;

}

.example{

    margin-top:17px;

    padding:15px;

    border-left:
        3px solid var(--blue);

    border-radius:9px;

    background:
        rgba(59,156,255,.05);

}

.example strong{

    color:#80cfff;

    font-size:8px;

}

.example p{

    margin-top:5px;

    font-size:10px;

}


/* =========================================================
   QUESTÃO
   ========================================================= */

.question{

    margin-top:17px;

    padding:17px;

    border:
        1px solid var(--border);

    border-radius:14px;

    background:
        rgba(255,255,255,.022);

}

.question-text{

    font-size:11px;

    line-height:1.7;

    font-weight:800;

}

.option{

    display:block;

    width:100%;

    margin-top:9px;

    padding:11px;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:
        rgba(255,255,255,.025);

    color:#c5d0dd;

    cursor:pointer;

    text-align:left;

    font-size:9px;

    transition:.2s;

}

.option:hover{

    background:
        rgba(59,156,255,.07);

    border-color:
        rgba(59,156,255,.25);

}

.option.correct{

    color:#8de9c1;

    background:
        rgba(67,214,155,.08);

    border-color:
        var(--green);

}

.option.wrong{

    color:#ff9bab;

    background:
        rgba(255,102,127,.08);

    border-color:
        var(--red);

}

.feedback{

    margin-top:11px;

    padding:11px;

    border-radius:9px;

    background:
        rgba(255,255,255,.035);

    color:var(--muted);

    font-size:9px;

    line-height:1.6;

}


/* =========================================================
   PROGRESSO
   ========================================================= */

.big-progress{

    margin-top:20px;

    padding:23px;

    border:
        1px solid
        rgba(59,156,255,.12);

    border-radius:20px;

    background:
        linear-gradient(
            120deg,
            rgba(59,156,255,.07),
            rgba(255,255,255,.02)
        );

}

.big-progress-head{

    display:flex;

    justify-content:space-between;

}

.big-progress-label{

    font-size:10px;

    font-weight:900;

}

.big-percent{

    color:var(--cyan);

    font-size:10px;

    font-weight:1000;

}


/* =========================================================
   FOCO
   ========================================================= */

.focus-overlay{

    position:fixed;

    inset:0;

    z-index:3000;

    display:none;

    place-items:center;

    background:
        rgba(5,7,12,.96);

    backdrop-filter:blur(20px);

}

.focus-overlay.active{
    display:grid;
}

.focus-box{

    width:min(520px,90%);

    text-align:center;

}

.focus-symbol{

    font-size:52px;

    animation:
        floating 3s ease-in-out infinite;

}

.focus-box h2{

    margin-top:16px;

    font-size:32px;

}

.focus-box p{

    margin-top:6px;

    color:var(--muted);

    font-size:10px;

}

.timer{

    margin-top:25px;

    font-size:
        clamp(
            65px,
            16vw,
            105px
        );

    font-weight:1000;

    letter-spacing:-5px;

}

.focus-actions{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:8px;

}


/* =========================================================
   TOAST
   ========================================================= */

.toast{

    position:fixed;

    left:50%;

    bottom:22px;

    z-index:5000;

    padding:12px 17px;

    border:
        1px solid
        rgba(59,156,255,.22);

    border-radius:11px;

    background:
        rgba(15,21,32,.98);

    color:white;

    font-size:9px;

    font-weight:850;

    opacity:0;

    transform:
        translate(-50%,20px);

    pointer-events:none;

    transition:.3s;

}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer{

    padding:
        35px 5%
        60px;

    border-top:
        1px solid var(--border);

    text-align:center;

    color:var(--muted);

    font-size:8px;

    line-height:1.9;

}

.footer strong{

    color:#dce5ef;

    letter-spacing:1px;

}


/* =========================================================
   ANIMAÇÕES
   ========================================================= */

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }

}


/* =========================================================
   RESPONSIVO
   ========================================================= */

@media(max-width:900px){

    .hero{

        grid-template-columns:1fr;

    }

    .hero-dashboard{

        max-width:500px;

    }

    .grid{

        grid-template-columns:
            repeat(2,1fr);

    }

    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }

}


@media(max-width:650px){

    .header{
        height:68px;
    }

    .nav{

        position:absolute;

        top:68px;

        left:0;
        right:0;

        display:none;

        flex-direction:column;

        padding:
            9px 5%
            14px;

        background:
            rgba(8,11,18,.98);

        border-bottom:
            1px solid var(--border);

    }

    .nav.open{
        display:flex;
    }

    .nav-button{

        width:100%;

        text-align:left;

        padding:12px;

    }

    .mobile-menu{
        display:block;
    }

    .hero{

        min-height:auto;

        padding-top:10px;

    }

    .hero h1{

        font-size:47px;

        letter-spacing:-3px;

    }

    .hero-dashboard{

        margin-top:15px;

    }

    .grid{

        grid-template-columns:1fr;

    }

    .daily-mission{

        align-items:flex-start;
