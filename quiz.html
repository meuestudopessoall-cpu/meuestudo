let perguntasQuiz = [];
let perguntaAtual = 0;
let pontuacao = 0;
let quizRespondido = false;

function iniciarQuiz() {
    const materia = document.getElementById('filtroMateriaQuiz').value;
    const modulo = document.getElementById('filtroModuloQuiz').value;
    const aula = document.getElementById('filtroAulaQuiz').value;

    const dadosMateria = DADOS[materia];
    if (!dadosMateria) { alert('Matéria não encontrada.'); return; }
    const dadosModulo = dadosMateria.modulos[modulo];
    if (!dadosModulo) { alert('Módulo não encontrado.'); return; }
    const dadosAula = dadosModulo.aulas[aula];
    if (!dadosAula) { alert('Aula não encontrada.'); return; }

    const questoes = dadosAula.questoes || [];
    if (questoes.length === 0) {
        document.getElementById('painelQuiz').innerHTML = '<p>Nenhuma questão disponível para esta aula.</p>';
        return;
    }

    perguntasQuiz = questoes.map(q => {
        const correta = q.resposta === 'C' ? 'CERTO' : 'ERRADO';
        return {
            pergunta: q.enunciado,
            opcoes: ['CERTO', 'ERRADO'],
            correta: correta,
            comentario: q.comentario || ''
        };
    });

    perguntaAtual = 0;
    pontuacao = 0;
    quizRespondido = false;
    renderizarPergunta();
}
