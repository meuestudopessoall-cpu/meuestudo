<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Trilha Policial 2026</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7fc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        h1 { color: #0b2b4a; border-bottom: 4px solid #1a73e8; padding-bottom: 12px; }
        .quiz-pergunta { background: #f8faff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin: 20px 0; }
        .quiz-opcoes button { background: #e8f0fe; border: 2px solid transparent; padding: 10px 18px; border-radius: 30px; margin: 5px; cursor: pointer; transition: 0.2s; }
        .quiz-opcoes button:hover { background: #d2e3fc; }
        .quiz-opcoes button.correto { border-color: #2e7d32; background: #e6f7e6; }
        .quiz-opcoes button.errado { border-color: #c62828; background: #fde8e8; }
        .quiz-feedback { margin-top: 12px; padding: 12px; border-radius: 8px; display: none; }
        .quiz-feedback.correto { display: block; background: #e6f7e6; border-left: 6px solid #2e7d32; }
        .quiz-feedback.errado { display: block; background: #fde8e8; border-left: 6px solid #c62828; }
        .botao-proximo { background: #1a73e8; color: #fff; border: none; padding: 10px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; margin: 10px 0; }
        .botao-proximo:hover { background: #0d47a1; }
        .filtro { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .filtro select, .filtro button { padding: 8px 16px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
        .filtro button { background: #1a73e8; color: #fff; border: none; cursor: pointer; }
        .filtro button:hover { background: #0d47a1; }
        .voltar { display: inline-block; margin: 20px 0; background: #e8f0fe; color: #1a73e8; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 600; }
        .voltar:hover { background: #d2e3fc; }
        .footer { margin-top: 30px; text-align: center; color: #7a8a9e; border-top: 1px solid #e2e8f0; padding-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 Quiz — Perguntas e Respostas</h1>
    <a href="index.html" class="voltar">← Voltar ao início</a>

    <div class="filtro">
        <select id="filtroMateriaQuiz">
            <option value="lingua-portuguesa">Língua Portuguesa</option>
            <option value="direito-constitucional">Direito Constitucional</option>
            <option value="direito-administrativo">Direito Administrativo</option>
            <option value="direito-penal">Direito Penal</option>
            <option value="direito-processual-penal">Direito Processual Penal</option>
            <option value="legislacao-penal-especial">Legislação Penal Especial</option>
            <option value="direitos-humanos">Direitos Humanos</option>
            <option value="raciocinio-logico">Raciocínio Lógico</option>
            <option value="informatica">Informática</option>
            <option value="lodf">LODF</option>
            <option value="ride">RIDE</option>
            <option value="lc-840">LC 840/2011</option>
            <option value="eca">ECA</option>
        </select>
        <select id="filtroModuloQuiz">
            <option value="modulo-1">Módulo 1</option>
            <option value="modulo-2">Módulo 2</option>
            <option value="modulo-3">Módulo 3</option>
            <option value="modulo-4">Módulo 4</option>
            <option value="modulo-5">Módulo 5</option>
        </select>
        <select id="filtroAulaQuiz">
            <option value="aula-1">Aula 1</option>
        </select>
        <button onclick="iniciarQuiz()">▶ Iniciar Quiz</button>
    </div>

    <div id="painelQuiz"></div>
    <div class="footer">🎯 Preparação para PCDF · PMDF · PF · PRF · PCGO · PMGO</div>
</div>

<script src="dados.js"></script>
<script>
let perguntasQuiz = [], perguntaAtual = 0, pontuacao = 0, quizRespondido = false;

function iniciarQuiz() {
    const materia = document.getElementById('filtroMateriaQuiz').value;
    const modulo = document.getElementById('filtroModuloQuiz').value;
    const aula = document.getElementById('filtroAulaQuiz').value;

    const dadosMateria = DADOS.materias[materia];
    if (!dadosMateria) { alert('Matéria não encontrada.'); return; }
    const dadosModulo = dadosMateria.modulos[modulo];
    if (!dadosModulo) { alert('Módulo não encontrado.'); return; }
    const dadosAula = dadosModulo.aulas[aula];
    if (!dadosAula) { alert('Aula não encontrada.'); return; }

    const questoes = dadosAula.questoes || [];
    if (questoes.length === 0) {
        document.getElementById('painelQuiz').innerHTML = '<p>Nenhuma questão disponível para esta aula.</p>';
        return;
    }

    perguntasQuiz = questoes.map(q => {
        const correta = q.resposta === 'C' ? 'CERTO' : 'ERRADO';
        const opcoes = ['CERTO', 'ERRADO'];
        return {
            pergunta: q.enunciado,
            opcoes: opcoes,
            correta: correta,
            comentario: q.comentario || '',
            pegadinha: q.pegadinha || ''
        };
    });

    perguntaAtual = 0;
    pontuacao = 0;
    quizRespondido = false;
    renderizarPergunta();
}

function renderizarPergunta() {
    const container = document.getElementById('painelQuiz');
    if (perguntaAtual >= perguntasQuiz.length) {
        container.innerHTML = `
            <div style="background:#e8f0fe; padding:20px; border-radius:12px; text-align:center;">
                <h2>🏁 Quiz finalizado!</h2>
                <p style="font-size:24px; font-weight:700;">Você acertou ${pontuacao} de ${perguntasQuiz.length}</p>
                <p style="font-size:18px;">Aproveitamento: ${Math.round((pontuacao/perguntasQuiz.length)*100)}%</p>
                <button onclick="iniciarQuiz()" style="margin-top:12px; background:#1a73e8; color:white; border:none; padding:10px 24px; border-radius:30px; font-weight:700; cursor:pointer;">🔁 Tentar novamente</button>
            </div>
        `;
        return;
    }

    const p = perguntasQuiz[perguntaAtual];
    let html = `
        <div class="quiz-pergunta">
            <p><strong>Pergunta ${perguntaAtual+1} de ${perguntasQuiz.length}</strong></p>
            <p>${p.pergunta}</p>
            <div class="quiz-opcoes" id="opcoes-${perguntaAtual}">
    `;
    p.opcoes.forEach((opcao) => {
        html += `<button onclick="responderQuiz(${perguntaAtual}, '${opcao}')" id="btn-${perguntaAtual}-${opcao}">${opcao}</button>`;
    });
    html += `
            </div>
            <div class="quiz-feedback" id="feedback-${perguntaAtual}"></div>
            <button class="botao-proximo" id="proximo-${perguntaAtual}" style="display:none;" onclick="proximaPergunta()">Próxima →</button>
        </div>
    `;
    container.innerHTML = html;
    quizRespondido = false;
}

function responderQuiz(index, opcao) {
    if (quizRespondido) return;
    const p = perguntasQuiz[index];
    const correta = p.correta;
    const feedback = document.getElementById(`feedback-${index}`);
    const botoes = document.querySelectorAll(`#opcoes-${index} button`);

    botoes.forEach(btn => btn.style.pointerEvents = 'none');
    botoes.forEach(btn => {
        if (btn.textContent === opcao) {
            btn.classList.add(opcao === correta ? 'correto' : 'errado');
        }
        if (btn.textContent === correta && opcao !== correta) {
            btn.classList.add('correto');
        }
    });

    const acertou = (opcao === correta);
    if (acertou) pontuacao++;
    feedback.className = 'quiz-feedback ' + (acertou ? 'correto' : 'errado');
    feedback.innerHTML = `
        <strong>${acertou ? '✅ Correto!' : '❌ Errado. A resposta correta é: ' + correta}</strong>
        <div style="margin-top:6px;">${p.comentario}</div>
        ${p.pegadinha ? `<div style="color:#c62828; font-weight:600;">⚠️ Pegadinha: ${p.pegadinha}</div>` : ''}
    `;
    quizRespondido = true;
    document.getElementById(`proximo-${index}`).style.display = 'inline-block';
}

function proximaPergunta() {
    perguntaAtual++;
    renderizarPergunta();
}

window.onload = iniciarQuiz;
</script>
</body>
</html>
