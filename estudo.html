<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudar — Trilha Policial 2026</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7fc; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        h1 { color: #0b2b4a; border-bottom: 4px solid #1a73e8; padding-bottom: 12px; margin-top: 0; }
        .menu-navegacao { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0 10px 0; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
        .menu-navegacao a { background: #1a73e8; color: #fff; padding: 8px 18px; border-radius: 30px; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; display: inline-block; }
        .menu-navegacao a:hover { background: #0d47a1; transform: scale(1.02); }
        .menu-navegacao a.secundario { background: #e8f0fe; color: #1a73e8; }
        .menu-navegacao a.secundario:hover { background: #d2e3fc; }
        .menu-navegacao .btn-voltar { background: #f9a825; color: #0b2b4a; border: none; cursor: pointer; font-weight: 700; padding: 8px 18px; border-radius: 30px; font-size: 14px; transition: 0.2s; display: inline-block; text-decoration: none; }
        .menu-navegacao .btn-voltar:hover { background: #fbc02d; transform: scale(1.02); }
        .filtro { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .filtro select, .filtro button { padding: 10px 16px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: #fff; outline: none; }
        .filtro select { flex: 1; min-width: 180px; }
        .filtro button { background: #1a73e8; color: #fff; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .filtro button:hover { background: #0d47a1; transform: scale(1.02); }
        .aula-card { background: #f8faff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin: 20px 0; }
        .aula-card h2 { color: #0b2b4a; border-left: 6px solid #1a73e8; padding-left: 12px; margin-top: 0; }
        .aula-card h3 { color: #1a73e8; margin-top: 20px; }
        .aula-card .secao { background: #fff; padding: 12px 16px; border-radius: 8px; margin: 12px 0; border-left: 4px solid #1a73e8; }
        .aula-card .secao.pegadinha { border-left-color: #e53935; background: #fde8e8; }
        .aula-card .secao.macete { border-left-color: #f9a825; background: #fff8e1; }
        .aula-card .secao.atencao { border-left-color: #ff6f00; background: #fff3e0; }
        .aula-card ul { margin: 8px 0 8px 20px; }
        .aula-card li { margin: 4px 0; line-height: 1.5; }
        .btn-praticar { display: inline-block; background: #1a73e8; color: #fff; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 600; margin: 12px 0; transition: 0.2s; }
        .btn-praticar:hover { background: #0d47a1; transform: scale(1.02); }
        .aviso-vazio { text-align: center; color: #666; padding: 40px; font-size: 16px; background: #fafafa; border-radius: 8px; border: 1px dashed #ccc; }
        .footer { margin-top: 30px; text-align: center; color: #7a8a9e; border-top: 1px solid #e2e8f0; padding-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 Estudar — Aulas Completas</h1>
    <div class="menu-navegacao">
        <a href="index.html" class="btn-voltar">🏠 Início</a>
        <button onclick="history.back()" class="btn-voltar" style="background:#f9a825; color:#0b2b4a; border:none; cursor:pointer; font-weight:700; padding:8px 18px; border-radius:30px; font-size:14px;">⬅ Voltar</button>
        <a href="resumos.html" class="secundario">📚 Resumos</a>
        <a href="questoes.html" class="secundario">📝 Questões</a>
        <a href="quiz.html" class="secundario">🧠 Quiz</a>
    </div>
    <div class="filtro">
        <select id="filtroMateriaEstudo" onchange="atualizarModulos()">
            <option value="lingua-portuguesa">Língua Portuguesa</option>
            <option value="direito-constitucional">Direito Constitucional</option>
            <option value="direito-administrativo">Direito Administrativo</option>
            <option value="direito-penal">Direito Penal</option>
            <option value="direito-processual-penal">Direito Processual Penal</option>
            <option value="legislacao-penal-especial">Legislação Penal Especial</option>
            <option value="direitos-humanos">Direitos Humanos</option>
            <option value="raciocinio-logico">Raciocínio Lógico</option>
            <option value="informatica">Informática</option>
            <option value="lodf">Lei Orgânica do DF (LODF)</option>
            <option value="ride">RIDE</option>
            <option value="lc-840">LC 840/2011</option>
            <option value="eca">ECA</option>
        </select>
        <select id="filtroModuloEstudo" onchange="atualizarAulas()"></select>
        <select id="filtroAulaEstudo"></select>
        <button onclick="carregarAula()">📖 Carregar Aula</button>
    </div>
    <div id="painelAula"><div class="aviso-vazio">Selecione uma matéria, módulo e aula acima e clique em "Carregar Aula".</div></div>
    <div class="footer">🎯 Preparação para PCDF · PMDF · PF · PRF · PCGO · PMGO</div>
</div>

<script src="dados/aulas.js"></script>
<script>
function atualizarModulos() {
    const materia = document.getElementById('filtroMateriaEstudo').value;
    const moduloSelect = document.getElementById('filtroModuloEstudo');
    moduloSelect.innerHTML = '';
    if (DADOS_AULAS[materia]) {
        for (const modulo in DADOS_AULAS[materia]) {
            const opt = document.createElement('option');
            opt.value = modulo;
            opt.textContent = modulo.replace('-', ' ').toUpperCase();
            moduloSelect.appendChild(opt);
        }
    }
    atualizarAulas();
}
function atualizarAulas() {
    const materia = document.getElementById('filtroMateriaEstudo').value;
    const modulo = document.getElementById('filtroModuloEstudo').value;
    const aulaSelect = document.getElementById('filtroAulaEstudo');
    aulaSelect.innerHTML = '';
    if (DADOS_AULAS[materia] && DADOS_AULAS[materia][modulo]) {
        for (const aula in DADOS_AULAS[materia][modulo]) {
            const opt = document.createElement('option');
            opt.value = aula;
            opt.textContent = aula.replace('-', ' ').toUpperCase();
            aulaSelect.appendChild(opt);
        }
    }
}
function carregarAula() {
    const materia = document.getElementById('filtroMateriaEstudo').value;
    const modulo = document.getElementById('filtroModuloEstudo').value;
    const aula = document.getElementById('filtroAulaEstudo').value;
    const painel = document.getElementById('painelAula');
    if (DADOS_AULAS[materia] && DADOS_AULAS[materia][modulo] && DADOS_AULAS[materia][modulo][aula]) {
        const dados = DADOS_AULAS[materia][modulo][aula];
        painel.innerHTML = `<div class="aula-card"><h2>${dados.titulo}</h2>${dados.conteudo}</div>`;
    } else {
        painel.innerHTML = `<div class="aula-card" style="border-left-color:#f9a825;"><h2>🚧 Conteúdo em Desenvolvimento</h2><p>O conteúdo para esta aula ainda está sendo finalizado.</p></div>`;
    }
}
window.onload = function() { atualizarModulos(); setTimeout(carregarAula, 100); };
</script>
</body>
</html>
