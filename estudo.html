                    <h2>📌 Conceito</h2>
                    <p>A Constituição é a <strong>lei fundamental e suprema</strong> de um Estado. Ela organiza os Poderes públicos, define a forma de governo e estabelece os direitos fundamentais. Nenhuma norma abaixo dela pode contrariá-la.</p>

                        <li><strong>Quanto à estabilidade:</strong> Totalmente Rígida (exige processo especial para alteração – art. 60).</li>
                        <li><strong>Quanto à forma:</strong> Escrita (codificada em um único documento).</li>
                        <li><strong>Quanto ao conteúdo:</strong> Formal e Material (todo o texto está na CF e trata de matérias constitucionais).</li>
                        <li><strong>Quanto ao modo de elaboração:</strong> Dogmática (elaborada a partir de princípios pré-existentes).</li>

                    </ul>

                    </div>

                    <p>O Congresso aprova uma lei ordinária permitindo pena de morte em tempo de paz. Como a CF/88 veda tal pena (art. 5º, XLVII, "a"), essa lei é inconstitucional. Pelo <strong>sentido jurídico de Kelsen</strong>, ela viola a norma suprema e não tem validade.</p>
