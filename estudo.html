<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudar — Trilha Policial 2026</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7fc; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        h1 { color: #0b2b4a; border-bottom: 4px solid #1a73e8; padding-bottom: 12px; margin-top: 0; }
        .voltar { display: inline-block; margin: 20px 0; background: #e8f0fe; color: #1a73e8; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 600; }
        .voltar:hover { background: #d2e3fc; }
        .filtro { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .filtro select, .filtro button { padding: 10px 16px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: #fff; outline: none; }
        .filtro select { flex: 1; min-width: 200px; }
        .filtro button { background: #1a73e8; color: #fff; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .filtro button:hover { background: #0d47a1; transform: scale(1.02); }
        .aula-card { background: #f8faff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin: 20px 0; }
        .aula-card h2 { color: #0b2b4a; border-left: 6px solid #1a73e8; padding-left: 12px; margin-top: 0; }
        .aula-card h3 { color: #1a73e8; margin-top: 20px; }
        .aula-card .secao { background: #fff; padding: 12px 16px; border-radius: 8px; margin: 12px 0; border-left: 4px solid #1a73e8; }
        .aula-card .secao.pegadinha { border-left-color: #e53935; background: #fde8e8; }
        .aula-card .secao.macete { border-left-color: #f9a825; background: #fff8e1; }
        .aula-card .secao.atencao { border-left-color: #ff6f00; background: #fff3e0; }
        .aula-card ul { margin: 8px 0 8px 20px; }
        .aula-card li { margin: 4px 0; line-height: 1.5; }
        .btn-praticar { display: inline-block; background: #1a73e8; color: #fff; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 600; margin: 12px 0; transition: 0.2s; }
        .btn-praticar:hover { background: #0d47a1; transform: scale(1.02); }
        .aviso-vazio { text-align: center; color: #666; padding: 40px; font-size: 16px; background: #fafafa; border-radius: 8px; border: 1px dashed #ccc; }
        .footer { margin-top: 30px; text-align: center; color: #7a8a9e; border-top: 1px solid #e2e8f0; padding-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 Estudar — Aulas Completas</h1>
    <a href="index.html" class="voltar">← Voltar ao início</a>

    <div class="filtro">
        <select id="filtroMateriaEstudo">
            <option value="direito-constitucional">Direito Constitucional</option>
            <option value="direito-administrativo">Direito Administrativo</option>
            <option value="direito-penal">Direito Penal</option>
            <option value="direito-processual-penal">Direito Processual Penal</option>
            <option value="legislacao-penal-especial">Legislação Penal Especial</option>
            <option value="direitos-humanos">Direitos Humanos</option>
            <option value="raciocinio-logico">Raciocínio Lógico</option>
            <option value="informatica">Informática</option>
            <option value="lodf">LODF</option>
            <option value="ride">RIDE</option>
            <option value="lc-840">LC 840/2011</option>
            <option value="eca">ECA</option>
        </select>
        <select id="filtroModuloEstudo">
            <option value="modulo-1">Módulo 1</option>
            <option value="modulo-2">Módulo 2</option>
            <option value="modulo-3">Módulo 3</option>
            <option value="modulo-4">Módulo 4</option>
            <option value="modulo-5">Módulo 5</option>
        </select>
        <select id="filtroAulaEstudo">
            <option value="aula-1">Aula 1</option>
        </select>
        <button onclick="carregarAula()">📖 Carregar Aula</button>
    </div>

    <div id="painelAula">
        <div class="aviso-vazio">Selecione uma matéria, módulo e aula acima e clique em "Carregar Aula".</div>
    </div>
    
    <div class="footer">🎯 Preparação para PCDF · PMDF · PF · PRF · PCGO · PMGO</div>
</div>

<script>
// ============================================================
// DADOS DE EXEMPLO (Base estruturada para as matérias)
// ============================================================
const AULAS = {
    "direito-constitucional": {
        "modulo-1": {
            "aula-1": {
                titulo: "Conceito, Sentidos e Classificações da Constituição",
                conteudo: `
                    <h2>📌 Conceito</h2>
                    <p>A Constituição é a <strong>lei fundamental e suprema</strong> de um Estado. Ela organiza os Poderes, define a forma de governo e estabelece os direitos fundamentais.</p>
                    <h2>🔍 Explicação Aprofundada</h2>
                    <p><strong>Sentido Sociológico (Lassalle):</strong> A Constituição real resume-se aos <strong>fatores reais de poder</strong> — forças econômicas, sociais e políticas.</p>
                    <p><strong>Sentido Político (Schmitt):</strong> A Constituição é a <strong>decisão política fundamental</strong> tomada pelo titular do poder constituinte.</p>
                    <p><strong>Sentido Jurídico (Kelsen):</strong> A Constituição é a <strong>norma pura</strong>, o ápice do ordenamento jurídico, fundamento de validade.</p>
                    <h3>📂 Classificações da CF/88</h3>
                    <ul>
                        <li><strong>Origem:</strong> Promulgada.</li>
                        <li><strong>Estabilidade:</strong> Totalmente Rígida.</li>
                        <li><strong>Forma:</strong> Escrita.</li>
                        <li><strong>Conteúdo:</strong> Formal e Material.</li>
                    </ul>
                    <div class="secao macete">
                        <strong>🧠 Macete:</strong> "PEDRO É FERA" — <strong>P</strong>romulgada, <strong>E</strong>scrita, <strong>D</strong>ogmática, <strong>R</strong>ígida, <strong>A</strong>nalítica, <strong>F</strong>ormal.
                    </div>
                    <div class="secao pegadinha">
                        <strong>⚠️ Pegadinha da Banca:</strong> A Cebraspe adora afirmar que a CF/88 é semi-rígida. <strong>ERRADO!</strong> É <strong>totalmente rígida</strong>.
                    </div>
                    <a href="questoes.html?materia=direito-constitucional&modulo=modulo-1&aula=aula-1" target="_blank" class="btn-praticar">📝 Praticar questões desta aula</a>
                `
            }
        },
        "modulo-2": {
            "aula-1": {
                titulo: "Poder Constituinte Originário e Derivado",
                conteudo: `
                    <h2>📌 Conceito</h2>
                    <p><strong>Poder Constituinte</strong> é a capacidade de criar, modificar ou complementar a Constituição.</p>
                    <div class="secao macete">
                        <strong>🧠 Macete:</strong> Características do PCO: <strong>"INILA"</strong> — <strong>I</strong>nicial, <strong>N</strong>ão condicionado, <strong>I</strong>limitado, <strong>L</strong>ivre, <strong>A</strong>utônomo.
                    </div>
                    <a href="questoes.html?materia=direito-constitucional&modulo=modulo-2&aula=aula-1" target="_blank" class="btn-praticar">📝 Praticar questões desta aula</a>
                `
            }
        }
    },
    "direito-administrativo": {
        "modulo-1": {
            "aula-1": {
                titulo: "Princípios da Administração Pública (LIMPE)",
                conteudo: `
                    <h2>📌 Conceito</h2>
                    <p>Os princípios da Administração Pública estão no <strong>art. 37, caput, da CF/88</strong>.</p>
                    <div class="secao macete">
                        <strong>🧠 Macete:</strong> "LIMPE" — <strong>L</strong>egalidade, <strong>I</strong>mpessoalidade, <strong>M</strong>oralidade, <strong>P</strong>ublicidade, <strong>E</strong>ficiência.
                    </div>
                    <a href="questoes.html?materia=direito-administrativo&modulo=modulo-1&aula=aula-1" target="_blank" class="btn-praticar">📝 Praticar questões desta aula</a>
                `
            }
        }
    }
};

// ============================================================
// FUNÇÃO PARA CARREGAR A AULA DINAMICAMENTE
// ============================================================
function carregarAula() {
    const materia = document.getElementById('filtroMateriaEstudo').value;
    const modulo = document.getElementById('filtroModuloEstudo').value;
    const aula = document.getElementById('filtroAulaEstudo').value;
    const painel = document.getElementById('painelAula');

    // Valida se existe a aula cadastrada no objeto
    if (AULAS[materia] && AULAS[materia][modulo] && AULAS[materia][modulo][aula]) {
        const dadosAula = AULAS[materia][modulo][aula];
        painel.innerHTML = `
            <div class="aula-card">
                <h2>${dadosAula.titulo}</h2>
                ${dadosAula.conteudo}
            </div>
        `;
    } else {
        painel.innerHTML = `
            <div class="aula-card" style="border-left-color: #f9a825;">
                <h2>🚧 Aula em Desenvolvimento</h2>
                <p>O conteúdo completo para esta aula específica ainda está sendo finalizado no sistema ou não possui registro cadastrado no momento.</p>
                <p>Tente selecionar <strong>Direito Constitucional (Módulo 1, Aula 1)</strong> ou <strong>Direito Administrativo (Módulo 1, Aula 1)</strong> para testar a visualização.</p>
            </div>
        `;
    }
}
</script>
</body>
</html>
