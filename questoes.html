<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questões — Trilha Policial 2026</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7fc; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        h1 { color: #0b2b4a; border-bottom: 4px solid #1a73e8; padding-bottom: 12px; }
        .voltar { display: inline-block; margin: 20px 0; background: #e8f0fe; color: #1a73e8; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 600; }
        .voltar:hover { background: #d2e3fc; }
        .filtro { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .filtro select, .filtro button { padding: 8px 16px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: #fff; }
        .filtro button { background: #1a73e8; color: #fff; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .filtro button:hover { background: #0d47a1; }
        .questao { background: #f8faff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; margin: 16px 0; }
        .opcoes { display: flex; gap: 16px; margin: 10px 0; }
        .opcoes button { background: #e8f0fe; border: 2px solid transparent; padding: 8px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .opcoes button:hover { background: #d2e3fc; }
        .opcoes button.selecionado-c { border-color: #1a73e8; background: #1a73e8; color: #fff; }
        .opcoes button.selecionado-e { border-color: #e53935; background: #e53935; color: #fff; }
        .resultado { margin-top: 10px; padding: 12px; border-radius: 8px; display: none; }
        .resultado.certo { display: block; background: #e6f7e6; border-left: 6px solid #2e7d32; }
        .resultado.errado { display: block; background: #fde8e8; border-left: 6px solid #c62828; }
        .resultado .comentario { margin-top: 6px; font-size: 14px; color: #1e2a3a; }
        .botao-corrigir { background: #1a73e8; color: #fff; border: none; padding: 12px 30px; border-radius: 30px; font-weight: 700; cursor: pointer; margin: 20px 0; }
        .botao-corrigir:hover { background: #0d47a1; }
        .resumo-desempenho { background: #e8f0fe; padding: 12px 20px; border-radius: 8px; margin: 20px 0; display: flex; gap: 30px; flex-wrap: wrap; }
        .footer { margin-top: 30px; text-align: center; color: #7a8a9e; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .aviso { background: #fff3cd; border-left: 6px solid #ffc107; padding: 12px 16px; border-radius: 8px; margin: 16px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>📝 Bateria de Questões</h1>
    <a href="index.html" class="voltar">← Voltar ao início</a>

    <!-- DIAGNÓSTICO: aviso se o DADOS não carregar -->
    <div id="aviso" style="display:none;" class="aviso">⚠️ Aguardando carregamento dos dados...</div>

    <div class="filtro">
        <select id="filtroMateria" onchange="atualizarModulos()">
            <option value="lingua-portuguesa">Língua Portuguesa</option>
            <option value="direito-constitucional">Direito Constitucional</option>
            <option value="direito-administrativo">Direito Administrativo</option>
            <option value="direito-penal">Direito Penal</option>
            <option value="direito-processual-penal">Direito Processual Penal</option>
            <option value="legislacao-penal-especial">Legislação Penal Especial</option>
            <option value="direitos-humanos">Direitos Humanos</option>
            <option value="raciocinio-logico">Raciocínio Lógico</option>
            <option value="informatica">Informática</option>
            <option value="lodf">LODF</option>
            <option value="ride">RIDE</option>
            <option value="lc-840">LC 840/2011</option>
            <option value="eca">ECA</option>
        </select>
        <select id="filtroModulo" onchange="atualizarAulas()">
            <!-- Preenchido dinamicamente -->
        </select>
        <select id="filtroAula">
            <!-- Preenchido dinamicamente -->
        </select>
        <button onclick="carregarQuestoes()">📖 Carregar questões</button>
    </div>

    <div id="painelQuestoes">
        <p style="text-align:center; color:#666; padding:20px;">Selecione uma matéria e clique em "Carregar questões".</p>
    </div>
    <div class="footer">🎯 Preparação para PCDF · PMDF · PF · PRF · PCGO · PMGO</div>
</div>

<script>
console.log('=== INICIANDO SCRIPT DAS QUESTÕES ===');

// ============================================================
// DADOS EMBUTIDOS — APENAS 2 MATÉRIAS PARA TESTE (simplificado)
// ============================================================
const DADOS = {
    "lingua-portuguesa": {
        nome: "Língua Portuguesa",
        modulos: {
            "modulo-1": {
                aulas: {
                    "aula-1": {
                        questoes: [
                            {id:1,enunciado:"Compreensão limita-se ao explícito. (TESTE)",resposta:"C",comentario:"CERTO."},
                            {id:2,enunciado:"Interpretação exige inferência. (TESTE)",resposta:"C",comentario:"CERTO."},
                            {id:3,enunciado:"Dissertativo tem sequência cronológica. (TESTE)",resposta:"E",comentario:"ERRADO."}
                        ]
                    }
                }
            }
        }
    },
    "direito-administrativo": {
        nome: "Direito Administrativo",
        modulos: {
            "modulo-1": {
                aulas: {
                    "aula-1": {
                        questoes: [
                            {id:1,enunciado:"Legalidade: só o que a lei autoriza. (TESTE)",resposta:"C",comentario:"CERTO."},
                            {id:2,enunciado:"Publicidade é absoluta. (TESTE)",resposta:"E",comentario:"ERRADO."},
                            {id:3,enunciado:"Eficiência foi inserida pela EC 19/98. (TESTE)",resposta:"C",comentario:"CERTO."}
                        ]
                    }
                }
            }
        }
    }
};

console.log('✅ DADOS carregado com sucesso!');
console.log('Matérias disponíveis:', Object.keys(DADOS));

// ============================================================
// FUNÇÕES DE CONTROLE
// ============================================================
function atualizarModulos() {
    const materia = document.getElementById('filtroMateria').value;
    const moduloSelect = document.getElementById('filtroModulo');
    moduloSelect.innerHTML = '';
    
    console.log('Atualizando módulos para:', materia);
    
    if (DADOS[materia] && DADOS[materia].modulos) {
        for (const modulo in DADOS[materia].modulos) {
            const opt = document.createElement('option');
            opt.value = modulo;
            opt.textContent = modulo.replace('-', ' ').toUpperCase();
            moduloSelect.appendChild(opt);
        }
    } else {
        const opt = document.createElement('option');
        opt.value = 'modulo-1';
        opt.textContent = 'Módulo 1';
        moduloSelect.appendChild(opt);
    }
    atualizarAulas();
}

function atualizarAulas() {
    const materia = document.getElementById('filtroMateria').value;
    const modulo = document.getElementById('filtroModulo').value;
    const aulaSelect = document.getElementById('filtroAula');
    aulaSelect.innerHTML = '';
    
    console.log('Atualizando aulas para:', materia, '->', modulo);
    
    if (DADOS[materia] && DADOS[materia].modulos && DADOS[materia].modulos[modulo]) {
        for (const aula in DADOS[materia].modulos[modulo].aulas) {
            const opt = document.createElement('option');
            opt.value = aula;
            opt.textContent = aula.replace('-', ' ').toUpperCase();
            aulaSelect.appendChild(opt);
        }
    } else {
        const opt = document.createElement('option');
        opt.value = 'aula-1';
        opt.textContent = 'Aula 1';
        aulaSelect.appendChild(opt);
    }
}

// ============================================================
// CARREGAR QUESTÕES — VERSÃO COM LOGS DETALHADOS
// ============================================================
let questoesAtuais = [];
let respostasUsuario = {};
let materiaAtual = '';
let moduloAtual = '';
let aulaAtual = '';

function carregarQuestoes() {
    console.log('🔵 carregarQuestoes() foi chamado!');
    
    const materia = document.getElementById('filtroMateria').value;
    const modulo = document.getElementById('filtroModulo').value;
    const aula = document.getElementById('filtroAula').value;

    console.log('Valores selecionados:', { materia, modulo, aula });
    console.log('DADOS disponível?', typeof DADOS !== 'undefined');
    console.log('DADOS[materia]?', DADOS[materia]);

    materiaAtual = materia;
    moduloAtual = modulo;
    aulaAtual = aula;

    const container = document.getElementById('painelQuestoes');

    // Verificação 1: DADOS existe?
    if (typeof DADOS === 'undefined') {
        container.innerHTML = '<p style="color:red;">❌ Erro: Dados não carregados. Recarregue a página.</p>';
        return;
    }

    // Verificação 2: matéria existe?
    const dadosMateria = DADOS[materia];
    if (!dadosMateria) {
        container.innerHTML = `<p style="color:red;">❌ Matéria "${materia}" não encontrada.</p>`;
        return;
    }

    // Verificação 3: módulo existe?
    const dadosModulo = dadosMateria.modulos[modulo];
    if (!dadosModulo) {
        container.innerHTML = `<p style="color:red;">❌ Módulo "${modulo}" não encontrado em "${materia}".</p>`;
        console.log('Módulos disponíveis:', Object.keys(dadosMateria.modulos));
        return;
    }

    // Verificação 4: aula existe?
    const dadosAula = dadosModulo.aulas[aula];
    if (!dadosAula) {
        container.innerHTML = `<p style="color:red;">❌ Aula "${aula}" não encontrada em "${materia}/${modulo}".</p>`;
        console.log('Aulas disponíveis:', Object.keys(dadosModulo.aulas));
        return;
    }

    // Pegando as questões
    questoesAtuais = dadosAula.questoes || [];
    console.log('Questões encontradas:', questoesAtuais.length);

    if (questoesAtuais.length === 0) {
        container.innerHTML = '<p>Nenhuma questão encontrada para esta aula.</p>';
        return;
    }

    respostasUsuario = {};
    renderizarQuestoes();
}

function renderizarQuestoes() {
    const container = document.getElementById('painelQuestoes');
    
    let html = `<div class="resumo-desempenho">
        <div><span id="contadorRespondidas">0</span> / ${questoesAtuais.length} respondidas</div>
        <div>✅ <span id="contadorAcertos">0</span> acertos</div>
        <div>❌ <span id="contadorErros">0</span> erros</div>
    </div>`;

    questoesAtuais.forEach((q, index) => {
        const num = index + 1;
        html += `
            <div class="questao" id="questao-${index}">
                <p><strong>QUESTÃO ${num}</strong></p>
                <p>${q.enunciado}</p>
                <div class="opcoes">
                    <button onclick="selecionarResposta(${index}, 'C')" id="btn-c-${index}">CERTO</button>
                    <button onclick="selecionarResposta(${index}, 'E')" id="btn-e-${index}">ERRADO</button>
                </div>
                <div class="resultado" id="resultado-${index}"></div>
            </div>
        `;
    });
    html += `<button class="botao-corrigir" onclick="corrigirTodas()">✅ Corrigir todas</button>`;
    container.innerHTML = html;
    atualizarContadores();
}

function selecionarResposta(index, letra) {
    document.getElementById(`btn-c-${index}`).className = '';
    document.getElementById(`btn-e-${index}`).className = '';
    if (letra === 'C') {
        document.getElementById(`btn-c-${index}`).classList.add('selecionado-c');
    } else {
        document.getElementById(`btn-e-${index}`).classList.add('selecionado-e');
    }
    respostasUsuario[index] = letra;
    document.getElementById(`resultado-${index}`).className = 'resultado';
    document.getElementById(`resultado-${index}`).innerHTML = '';
    atualizarContadores();
}

function corrigirTodas() {
    let acertos = 0;
    let erros = 0;

    questoesAtuais.forEach((q, index) => {
        const resposta = respostasUsuario[index];
        const resultadoDiv = document.getElementById(`resultado-${index}`);
        resultadoDiv.className = 'resultado';
        if (!resposta) {
            resultadoDiv.classList.add('errado');
            resultadoDiv.innerHTML = `<strong>⚠️ Não respondida.</strong>`;
            return;
        }
        const correta = q.resposta === 'C' ? 'C' : 'E';
        if (resposta === correta) {
            acertos++;
            resultadoDiv.classList.add('certo');
            resultadoDiv.innerHTML = `<strong>✅ CORRETO!</strong><div class="comentario">${q.comentario || ''}</div>`;
        } else {
            erros++;
            resultadoDiv.classList.add('errado');
            resultadoDiv.innerHTML = `<strong>❌ ERRADO. Resposta correta: ${correta}.</strong><div class="comentario">${q.comentario || ''}</div>`;
        }
    });

    document.getElementById('contadorAcertos').textContent = acertos;
    document.getElementById('contadorErros').textContent = erros;
    const respondidas = Object.keys(respostasUsuario).length;
    document.getElementById('contadorRespondidas').textContent = respondidas;
}

function atualizarContadores() {
    const respondidas = Object.keys(respostasUsuario).length;
    document.getElementById('contadorRespondidas').textContent = respondidas;
    document.getElementById('contadorAcertos').textContent = '?';
    document.getElementById('contadorErros').textContent = '?';
}

// ============================================================
// INICIALIZAÇÃO — ao carregar a página
// ============================================================
window.onload = function() {
    console.log('🟢 Página carregada! Inicializando...');
    
    // Verifica se DADOS existe
    if (typeof DADOS === 'undefined') {
        document.getElementById('aviso').style.display = 'block';
        document.getElementById('aviso').textContent = '❌ ERRO: Dados não carregados!';
        return;
    }
    
    document.getElementById('aviso').style.display = 'block';
    document.getElementById('aviso').textContent = '✅ Dados carregados com sucesso!';
    
    atualizarModulos();
    carregarQuestoes();
};
</script>
</body>
</html>
